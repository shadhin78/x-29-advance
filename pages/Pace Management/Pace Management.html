<!-- Pace Stats Section (contains Global Baseline Info Card and Paces Row) -->
<div id="pace-stats-section" class="w-full space-y-6">
    <!-- Global Baseline Info Card -->
    <div
        class="flex items-center space-x-2 md:space-x-3 bg-slate-900 p-3 sm:p-4 rounded-xl sm:rounded-2xl border border-slate-700 shadow-lg ">
        <svg class="w-5 h-5 md:w-6 md:h-6 text-blue-500" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <div id="pace-timeline-info" class="text-xs sm:text-sm text-slate-300"></div>
    </div>

    <!-- Paces Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6 md:gap-8">
        <div
            class="bg-slate-900 border border-slate-700 p-5 sm:p-6 md:p-7 rounded-2xl sm:rounded-3xl md:rounded-[2rem] shadow-xl flex flex-col justify-between hover:-translate-y-1 transition-transform">
            <div class="text-white"><span id="target-status-label"
                    class="text-[8px] sm:text-[9px] md:text-[10px] font-black text-blue-400 uppercase tracking-widest drop-shadow-sm">Target:
                    Oct 31</span>
                <h3 class="text-lg sm:text-xl md:text-2xl font-black mt-1.5 sm:mt-2">Required Pace</h3>
            </div>
            <div class="mt-4 sm:mt-5 md:mt-6">
                <div id="target-req-pace"
                    class="text-2xl sm:text-3xl md:text-4xl font-black text-blue-400 drop-shadow-[0_2px_10px_rgba(96,165,250,0.4)]">
                    --</div>
                <div class="flex items-center justify-between mt-1.5">
                    <span class="text-[9px] text-slate-400 font-bold uppercase tracking-widest block">To
                        hit deadline</span>
                    <span id="global-days-left"
                        class="text-[9px] text-blue-400 font-black uppercase tracking-widest"></span>
                </div>
            </div>
        </div>
        <div
            class="bg-white dark:bg-slate-800 p-5 sm:p-6 md:p-7 rounded-2xl sm:rounded-3xl md:rounded-[2rem] border border-slate-200/50 dark:border-slate-700/50 shadow-sm flex flex-col justify-between hover:-translate-y-1 transition-transform">
            <div><span
                    class="text-[8px] sm:text-[9px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest">Current
                    Performance</span>
                <h3 class="text-lg sm:text-xl md:text-2xl font-black mt-1.5 sm:mt-2">Actual Pace</h3>
            </div>
            <div class="mt-4 sm:mt-5 md:mt-6">
                <div id="current-pace-stat" class="text-2xl sm:text-3xl md:text-4xl font-black">--</div>
                <div class="flex items-center justify-between mt-1.5">
                    <span
                        class="text-[9px] text-slate-400 font-bold uppercase tracking-widest block">Your
                        current speed</span>
                    <span id="global-days-passed"
                        class="text-[9px] text-emerald-500 font-black uppercase tracking-widest"></span>
                </div>
            </div>
        </div>
        <div
            class="bg-indigo-50 dark:bg-indigo-900/20 p-5 sm:p-6 md:p-7 rounded-2xl sm:rounded-3xl md:rounded-[2rem] border border-indigo-100 dark:border-indigo-800/50 shadow-sm flex flex-col justify-between hover:-translate-y-1 transition-transform relative group">
            <button onclick="window.openPaceTrendModal()"
                class="absolute top-4 right-4 p-2.5 bg-indigo-100 dark:bg-indigo-800/60 text-indigo-600 dark:text-indigo-300 rounded-xl hover:bg-indigo-200 dark:hover:bg-indigo-700 transition-all shadow-sm opacity-100 lg:opacity-0 lg:group-hover:opacity-100 hover:scale-110 active:scale-95"
                title="View Pace Analytics Chart">
                <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z">
                    </path>
                </svg>
            </button>
            <div><span
                    class="text-[8px] sm:text-[9px] md:text-[10px] font-black text-indigo-400 uppercase tracking-widest">Trend
                    Forecast</span>
                <h3
                    class="text-lg sm:text-xl md:text-2xl font-black mt-1.5 sm:mt-2 text-indigo-950 dark:text-indigo-100">
                    Est. Finish</h3>
            </div>
            <div class="mt-4 sm:mt-5 md:mt-6">
                <div id="projected-finish"
                    class="text-xl sm:text-2xl md:text-3xl font-black text-indigo-600 dark:text-indigo-400">
                    --</div>
                <div class="flex items-center justify-between mt-1.5">
                    <span
                        class="text-[9px] text-indigo-400/80 font-bold uppercase tracking-widest block">Based
                        on actual pace</span>
                    <span id="global-days-needed"
                        class="text-[9px] text-orange-500 font-black uppercase tracking-widest"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Pace Management System -->
<div id="pace-management-section"
    class="mt-8 md:mt-12 bg-white dark:bg-slate-800 p-5 md:p-8 rounded-2xl md:rounded-[2.5rem] border border-slate-200/50 dark:border-slate-700/50 shadow-sm flex flex-col scroll-mt-24 md:scroll-mt-32">
    <div
        class="flex justify-between items-center mb-6 border-b border-slate-100 dark:border-slate-700 pb-4">
        <div class="flex items-center space-x-3">
            <div
                class="p-2.5 bg-orange-50 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400 rounded-xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <div>
                <h3 class="text-base md:text-lg font-black dark:text-white leading-tight">Pace
                    Management
                </h3>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-0.5">Bundle
                    subjects
                    or programs together to create specific timeline goals</p>
            </div>
        </div>
    </div>

    <!-- Add Goal Form -->
    <div
        class="bg-slate-50 dark:bg-slate-900/50 p-4 md:p-6 rounded-2xl md:rounded-3xl border border-slate-100 dark:border-slate-800 mb-8 shadow-inner">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-end mb-5">
            <div class="flex flex-col gap-1.5">
                <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Bundle
                    Type</label>
                <select id="add-pace-bundle-type" onchange="window.togglePaceBundleType()"
                    class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-orange-500 font-bold w-full">
                    <option value="subjects" selected>Specific Subjects (Across Programs)</option>
                    <option value="programs">Multiple Entire Programs</option>
                    <option value="global">Global Overall Goal</option>
                </select>
            </div>
            <div class="flex flex-col gap-1.5" id="add-pace-name-container">
                <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Goal
                    Name</label>
                <input type="text" id="add-pace-name" placeholder="e.g. Phase 1 Year Target"
                    class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-orange-500 font-bold w-full">
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Start
                    Date</label>
                <input type="date" id="add-pace-start"
                    class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-orange-500 font-bold w-full">
            </div>
            <div class="flex flex-col gap-1.5">
                <label
                    class="text-[10px] font-black uppercase tracking-widest text-slate-400">Deadline</label>
                <input type="date" id="add-pace-date"
                    class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-orange-500 font-bold w-full">
            </div>
        </div>

        <div class="flex flex-col gap-3" id="add-pace-checklist-section">
            <label id="add-pace-checklist-label"
                class="text-[10px] font-black uppercase tracking-widest text-slate-400 border-b border-slate-200 dark:border-slate-700 pb-1.5">Select
                Items to Include</label>
            <div id="add-pace-subjects-container"
                class="flex flex-col gap-3 max-h-80 overflow-y-auto custom-scrollbar p-1">
                <!-- Accordions and Checkboxes injected here -->
            </div>
        </div>

        <div class="mt-6 border-t border-slate-200 dark:border-slate-700 pt-5">
            <button onclick="window.addPaceGoal()"
                class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-black text-[10px] md:text-xs uppercase tracking-widest py-3 md:py-3.5 rounded-xl transition-all shadow-[0_4px_12px_rgba(249,115,22,0.3)] hover:shadow-[0_6px_16px_rgba(249,115,22,0.4)] hover:-translate-y-0.5 active:scale-95">Create
                Pace Target</button>
        </div>
    </div>

    <!-- Goals Grid -->
    <h4 id="active-timelines-heading"
        class="text-xs font-black uppercase tracking-widest text-slate-400 mb-4 scroll-mt-24 md:scroll-mt-32">
        Active Timelines</h4>
    <div id="pace-goals-container"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-5">
        <!-- Dynamically populated via JS -->
    </div>
</div>
