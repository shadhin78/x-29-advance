<!-- Global Completion -->
<div id="completion-stats-section" class="grid grid-cols-1 lg:grid-cols-4 gap-4 sm:gap-6 md:gap-8">
    <div
        class="lg:col-span-3 bg-gradient-to-br from-white to-slate-50 dark:from-slate-800 dark:to-slate-800/80 p-5 sm:p-6 md:p-8 rounded-2xl sm:rounded-3xl md:rounded-[2rem] border border-slate-200/50 dark:border-slate-700/50 flex flex-col justify-between shadow-sm hover:shadow-xl transition-shadow relative group">
        <button onclick="window.openGlobalHistoryModal()"
            class="absolute top-4 right-4 sm:top-6 sm:right-6 p-2 sm:px-3 sm:py-2 bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 rounded-xl hover:bg-blue-200 dark:hover:bg-blue-800/60 transition-all shadow-sm active:scale-95 flex items-center justify-center gap-1.5 z-10 border border-blue-200 dark:border-blue-800/50"
            title="Open History Database">
            <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                    d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4">
                </path>
            </svg>
            <span
                class="text-[9px] md:text-[10px] font-black uppercase tracking-widest hidden sm:block">Database</span>
        </button>
        <div>
            <div class="flex justify-between items-end mb-4 sm:mb-5 md:mb-6 pr-10 sm:pr-24">
                <div><span id="progress-title"
                        class="block text-[9px] sm:text-[10px] md:text-[11px] font-black text-slate-400 uppercase mb-1 sm:mb-2 tracking-widest">Global
                        Overall Completion</span>
                    <h2 id="progress-text"
                        class="text-4xl sm:text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-500 drop-shadow-sm leading-none">
                        0%</h2>
                </div>
                <div id="progress-detail"
                    class="text-[10px] sm:text-xs md:text-sm font-black text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-900 px-2 sm:px-3 md:px-4 py-1 sm:py-1.5 md:py-2 rounded-lg md:rounded-xl whitespace-nowrap">
                    0 / 0 Chapters</div>
            </div>
            <div
                class="w-full bg-slate-100 dark:bg-slate-900 h-4 sm:h-5 md:h-6 rounded-full overflow-hidden shadow-inner p-0.5 md:p-1 border border-slate-200 dark:border-slate-800">
                <div id="progress-bar"
                    class="bg-gradient-to-r from-blue-500 to-indigo-500 h-full rounded-full transition-all duration-1000 shadow-[0_0_10px_rgba(99,102,241,0.5)]">
                </div>
            </div>
        </div>
    </div>
    <div
        class="bg-white dark:bg-slate-800 p-5 sm:p-6 md:p-8 rounded-2xl sm:rounded-3xl md:rounded-[2rem] border border-slate-200/50 dark:border-slate-700/50 relative flex items-center justify-center shadow-sm hover:shadow-xl transition-shadow">
        <button onclick="window.openGlobalChaptersModal()"
            class="relative flex items-center justify-center hover:scale-105 active:scale-95 transition-all focus:outline-none cursor-pointer group w-28 h-28 sm:w-36 sm:h-36 md:w-40 md:h-40"
            title="View All Subject Completions">
            <canvas id="progressChart"
                class="w-full h-full max-w-[120px] max-h-[120px] sm:max-w-[140px] sm:max-h-[140px] md:max-w-[160px] md:max-h-[160px] drop-shadow-lg pointer-events-none"></canvas>
            <div
                class="absolute inset-0 flex items-center justify-center pointer-events-none text-[9px] sm:text-[10px] md:text-[11px] font-black text-slate-350 dark:text-slate-600 group-hover:text-blue-500 dark:group-hover:text-blue-400 transition-colors uppercase tracking-widest">
                Syllabus</div>
        </button>
    </div>
</div>

<details id="sidebar-progress-section"
    class="bg-white dark:bg-slate-800 rounded-2xl sm:rounded-3xl md:rounded-[2rem] border border-slate-200/50 dark:border-slate-700/50 shadow-sm scroll-mt-24 md:scroll-mt-32 w-full group overflow-hidden">
    <summary
        class="cursor-pointer p-5 sm:p-6 md:p-7 outline-none select-none list-none flex items-center justify-between hover:bg-slate-50/50 dark:hover:bg-slate-800/80 transition-colors [&::-webkit-details-marker]:hidden">
        <h2 class="text-xs md:text-sm font-black uppercase tracking-widest">
            Subject Progress</h2>
        <div
            class="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-700/50 text-slate-400 group-open:rotate-180 transition-all duration-300 shrink-0 border border-slate-200/50 dark:border-slate-600/30">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                    d="M19 9l-7 7-7-7"></path>
            </svg>
        </div>
    </summary>
    <div class="p-5 sm:p-6 md:p-7 pt-0 sm:pt-0 md:pt-0">
        <div id="subject-progress-container"></div>
    </div>
</details>

<div id="subject-navigation-section"
    class="bg-white dark:bg-slate-800 p-5 sm:p-6 md:p-7 rounded-2xl sm:rounded-3xl md:rounded-[2rem] border border-slate-200/50 dark:border-slate-700/50 shadow-sm space-y-4 md:space-y-6 w-full">
    <h2
        class="text-xs md:text-sm font-black uppercase tracking-widest border-b border-slate-100 dark:border-slate-700 pb-2 md:pb-3">
        Filter Tasks by Subject</h2>
    <div id="subject-navigation-container" class="space-y-4"></div>
</div>

<!-- Task list section -->
<div id="dashboard-content" class="w-full">
    <div id="task-list" class="flex flex-col space-y-8 md:space-y-12 w-full pb-4"></div>
</div>
